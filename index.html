<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Chit</title>

<style>
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#111;
  --accent:#4f7cff;
}

/* FONT SIZES */
body.small{font-size:14px}
body.medium{font-size:16px}
body.large{font-size:18px}

/* BODY + BACKGROUND IMAGE */
body{
  margin:0;
  font-family:system-ui,sans-serif;
  color:var(--text);

  background:
    linear-gradient(
      rgba(255,255,255,0.85),
      rgba(255,255,255,0.85)
    ),
    url("backimg.png");

  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

/* ===== PUBLIC MODE LOCKDOWN ===== */
body.public #exportPublic,
body.public #creatorPanel,
body.public #loginBox{
  display:none !important;
}

#hamburger{
  position:fixed;
  top:16px;
  left:16px;
  font-size:26px;
  background:#ffffff;
  padding:6px 10px;
  border-radius:10px;
  cursor:pointer;
  z-index:1000;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}

/* WHITE SIDEBAR */
#sidebar{
  position:fixed;
  top:0;
  left:-260px;
  width:240px;
  height:100%;
  background:#ffffff;
  padding:72px 20px 20px;
  transition:left .3s ease;
  z-index:900;
  overflow-y:auto;
  box-shadow:4px 0 20px rgba(0,0,0,.12);
}
#sidebar.open{left:0}

.tag-item,.setting-item{
  padding:8px 10px;
  border-radius:10px;
  cursor:pointer;
}
.tag-item:hover,.setting-item:hover{
  background:rgba(0,0,0,.06);
}

#sideOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.3);
  z-index:800;
}
#sideOverlay.show{display:block}

/* HEADER + BANNER */
header{
  text-align:center;
  padding:40px 20px;
  user-select:none;
}
  header h1{
  margin:0;
  font-size:2.2rem;
}

header p{
  margin-top:8px;
  opacity:0.7;
}


main{
  max-width:800px;
  margin:auto;
  padding:20px;
}

article{
  background:var(--card);
  padding:18px;
  border-radius:16px;
  margin-bottom:16px;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}

article img{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px;
}

#loginBox,#creatorPanel{
  display:none;
  background:var(--card);
  padding:16px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}

input,textarea,button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  background:var(--accent);
  color:white;
  font-weight:bold;
  border:none;
}
.secondary{background:#777}
.danger{background:#c0392b}

#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:1200;
}

#popup{
  background:var(--card);
  max-width:700px;
  margin:10vh auto;
  padding:20px;
  border-radius:18px;
}

#popupControls{
  display:flex;
  gap:10px;
  margin-top:12px;
}
</style>
</head>

<body>

<div id="hamburger">☰</div>

<div id="sidebar">
  <h3>Tags</h3>
  <div class="tag-item" id="clearTags">All</div>
  <div id="tagList"></div>

  <h3>Settings</h3>
  <div class="setting-item" id="fontSmall">🔤 Small text</div>
  <div class="setting-item" id="fontMedium">🔤 Medium text</div>
  <div class="setting-item" id="fontLarge">🔤 Large text</div>
</div>

<div id="sideOverlay"></div>

<!-- ✅ BANNER (15 taps still work here) -->
<header id="secretHeader">
  <h1>🚀 Space Chit</h1>
  <p>A private space for conscious thought</p>
</header>


<main>

<section id="loginBox">
  <input type="password" id="passwordInput" placeholder="Password">
  <button id="loginBtn">Login</button>
</section>

<section id="creatorPanel">
  <input id="titleInput" placeholder="Post title">
  <textarea id="contentInput" placeholder="Write your post..."></textarea>
  <input id="tagsInput" placeholder="Tags (comma separated)">
  <input type="file" id="imageInput" accept="image/*">
  <input id="captionInput" placeholder="Image caption (optional)">

  <button id="saveBtn">Save</button>
  <button class="secondary" id="cancelEditBtn" style="display:none">Cancel Edit</button>
  <button class="secondary" id="logoutBtn">Logout</button>
  <button class="secondary" id="exportPublic">📤 Export for Public</button>
</section>

<input id="searchInput" placeholder="Search posts...">
<div id="posts"></div>

</main>

<div id="overlay">
  <div id="popup">
    <h2 id="popupTitle"></h2>
    <img id="popupImage" style="display:none">
    <p id="popupContent"></p>
    <div id="popupControls"></div>
    <button id="closePopupBtn">Close</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const isPublic = new URLSearchParams(location.search).get("public") === "1";
if(isPublic){
  document.body.classList.add("public");
  localStorage.removeItem("creator");
}

/* Paste exported posts here */
const PUBLIC_POSTS = [];

const PASSWORD="space123";
let posts = isPublic ? PUBLIC_POSTS : JSON.parse(localStorage.getItem("posts")) || [];
let filteredIds=null, editId=null, searchQuery="", taps=0;

const $=id=>document.getElementById(id);

/* FONT */
function applyFont(){
  const f=localStorage.getItem("font")||"medium";
  document.body.classList.remove("small","medium","large");
  document.body.classList.add(f);
}
$("fontSmall").onclick=()=>{localStorage.setItem("font","small");applyFont()};
$("fontMedium").onclick=()=>{localStorage.setItem("font","medium");applyFont()};
$("fontLarge").onclick=()=>{localStorage.setItem("font","large");applyFont()};
applyFont();

/* EXPORT */
$("exportPublic").onclick=()=>{
  if(!confirm("Export posts for public sharing?"))return;
  const data=`const PUBLIC_POSTS = ${JSON.stringify(posts,null,2)};`;
  const w=window.open();
  w.document.write(`<pre>${data}</pre>`);
};

/* UTIL */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);

/* RENDER */
function renderPosts(){
  $("posts").innerHTML="";
  let list=filteredIds?posts.filter(p=>filteredIds.includes(p.id)):posts;
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    list=list.filter(p=>p.title.toLowerCase().includes(q)||p.content.toLowerCase().includes(q));
  }
  list=[...list].sort((a,b)=>(b.pinned===true)-(a.pinned===true));

  list.forEach(p=>{
    const a=document.createElement("article");
    a.innerHTML=`<h3>${p.title}${p.pinned?" 📌":""}</h3>
      <p style="opacity:.7">${p.content.slice(0,120)}${p.content.length>120?"…":""}</p>`;
    if(p.image){
      a.innerHTML+=`<img src="${p.image}">`;
      if(p.caption)a.innerHTML+=`<div style="opacity:.7">${p.caption}</div>`;
    }
    a.onclick=()=>openPopup(p.id);
    $("posts").appendChild(a);
  });
  buildTags();
}

/* TAGS */
function buildTags(){
  $("tagList").innerHTML="";
  const map={};
  posts.forEach(p=>p.tags.forEach(t=>map[t]=(map[t]||0)+1));
  Object.keys(map).sort().forEach(t=>{
    const d=document.createElement("div");
    d.className="tag-item";
    d.textContent=`${t} (${map[t]})`;
    d.onclick=()=>{filteredIds=posts.filter(p=>p.tags.includes(t)).map(p=>p.id);closeSidebar();renderPosts()};
    $("tagList").appendChild(d);
  });
}
$("clearTags").onclick=()=>{filteredIds=null;closeSidebar();renderPosts()};

/* SAVE */
$("saveBtn").onclick=()=>{
  const title=$("titleInput").value.trim();
  const content=$("contentInput").value.trim();
  if(!title||!content)return alert("Fill everything");
  const tags=$("tagsInput").value.split(",").map(t=>t.trim()).filter(Boolean);
  const caption=$("captionInput").value.trim();

  const finalize=img=>{
    if(editId){
      Object.assign(posts.find(p=>p.id===editId),{title,content,tags,image:img,caption});
      editId=null;$("cancelEditBtn").style.display="none";
    }else{
      posts.unshift({id:uid(),title,content,tags,image:img,caption,pinned:false});
    }
    localStorage.setItem("posts",JSON.stringify(posts));
    ["titleInput","contentInput","tagsInput","captionInput"].forEach(id=>$(id).value="");
    $("imageInput").value="";
    renderPosts();
  };

  const f=$("imageInput").files[0];
  if(f){const r=new FileReader();r.onload=e=>finalize(e.target.result);r.readAsDataURL(f)}
  else finalize(editId?posts.find(p=>p.id===editId).image:null);
};

/* POPUP */
function openPopup(id){
  const p=posts.find(x=>x.id===id);
  $("popupTitle").textContent=p.title;
  $("popupContent").textContent=p.content;
  $("popupImage").style.display=p.image?"block":"none";
  $("popupImage").src=p.image||"";
  $("popupControls").innerHTML="";
  if(!isPublic && localStorage.getItem("creator")==="true"){
    ["Edit","Delete",p.pinned?"Unpin":"Pin"].forEach(t=>{
      const b=document.createElement("button");
      b.textContent=t;
      if(t==="Delete")b.className="danger";
      if(t==="Pin"||t==="Unpin")b.className="secondary";
      b.onclick=()=>{
        if(t==="Edit")startEdit(id);
        if(t==="Delete")deletePost(id);
        if(t==="Pin"||t==="Unpin"){p.pinned=!p.pinned;localStorage.setItem("posts",JSON.stringify(posts));renderPosts();closePopup();}
      };
      $("popupControls").appendChild(b);
    });
  }
  $("overlay").style.display="block";
}
const closePopup=()=>$("overlay").style.display="none";
$("closePopupBtn").onclick=closePopup;
$("overlay").onclick=e=>{if(e.target.id==="overlay")closePopup()};

/* EDIT / DELETE */
function startEdit(id){
  closePopup();
  const p=posts.find(x=>x.id===id);
  editId=id;
  $("titleInput").value=p.title;
  $("contentInput").value=p.content;
  $("tagsInput").value=p.tags.join(",");
  $("captionInput").value=p.caption||"";
  $("cancelEditBtn").style.display="block";
}
function deletePost(id){
  if(!confirm("Delete post?"))return;
  posts=posts.filter(p=>p.id!==id);
  localStorage.setItem("posts",JSON.stringify(posts));
  closePopup();renderPosts();
}
$("cancelEditBtn").onclick=()=>{editId=null;$("cancelEditBtn").style.display="none"};

/* SEARCH */
$("searchInput").oninput=()=>{searchQuery=$("searchInput").value.trim();renderPosts()};

/* SIDEBAR */
$("hamburger").onclick=()=>{$("sidebar").classList.add("open");$("sideOverlay").classList.add("show")};
const closeSidebar=()=>{$("sidebar").classList.remove("open");$("sideOverlay").classList.remove("show")};
$("sideOverlay").onclick=closeSidebar;

/* AUTH */
$("secretHeader").onclick=()=>{if(++taps>=15){$("loginBox").style.display="block";taps=0}};
$("loginBtn").onclick=()=>{if($("passwordInput").value===PASSWORD){localStorage.setItem("creator","true");$("loginBox").style.display="none";$("creatorPanel").style.display="block"}};
$("logoutBtn").onclick=()=>{localStorage.removeItem("creator");$("creatorPanel").style.display="none"};

/* INIT */
if (!isPublic && localStorage.getItem("creator") === "true") {
  $("creatorPanel").style.display = "block";
}

renderPosts();

});
</script>

<footer style="text-align:center; opacity:.6; font-size:14px; padding:30px 10px;">
  For any issues or questions, email me at
  <a href="mailto:kwachitadhyaru@gmail.com" style="color:inherit;">
    kwachitadhyaru@gmail.com
  </a>
</footer>

</body>
</html>
